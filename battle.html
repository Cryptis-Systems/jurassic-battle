/* ===== V8 Responsive / Premium GUI pass ===== */
:root{
  --bg0:#020705;
  --bg1:#07140f;
  --panelA:rgba(12,31,24,.93);
  --panelB:rgba(8,21,16,.96);
  --line2:rgba(112,232,159,.24);
  --glow:rgba(87,224,141,.18);
  --gold2:#ffd76a;
  --cyan:#77d7ff;
}
body{
  background:
    radial-gradient(circle at 20% 0%,rgba(57,137,88,.20),transparent 34%),
    radial-gradient(circle at 90% 8%,rgba(40,93,76,.18),transparent 30%),
    linear-gradient(180deg,var(--bg1),var(--bg0));
  min-height:100svh;
}
.app{
  width:min(100%,1280px);
  margin:auto;
  padding:clamp(10px,1.6vw,22px);
}
.panel,.card,.result{
  background:
    linear-gradient(180deg,rgba(255,255,255,.025),transparent 34%),
    linear-gradient(180deg,var(--panelA),var(--panelB));
  border:1px solid var(--line2);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 18px 55px rgba(0,0,0,.30);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.selectionHero{
  padding-top:clamp(8px,2vh,24px);
}
.selectionHero h1{
  letter-spacing:.08em;
  text-shadow:0 0 28px rgba(98,219,130,.11);
}
.selectionHero h2{
  color:var(--gold2);
  letter-spacing:.04em;
}
select,button{
  min-height:48px;
  font-weight:750;
}
select{
  background:linear-gradient(180deg,#0d2119,#07140f);
  border-color:rgba(112,232,159,.30);
}
button{
  transition:transform .13s ease,box-shadow .13s ease,border-color .13s ease,filter .13s ease;
}
button:active{transform:scale(.985)}
.primary{
  box-shadow:0 10px 30px rgba(63,197,102,.20), inset 0 1px 0 rgba(255,255,255,.20);
}
.battleTop{
  position:sticky;
  top:0;
  z-index:20;
  padding:7px 0 9px;
  background:linear-gradient(180deg,rgba(2,7,5,.96),rgba(2,7,5,.72),transparent);
  backdrop-filter:blur(10px);
}
.battleTitle{
  letter-spacing:.08em;
  font-size:clamp(16px,2vw,23px);
}
.card{
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(102,224,145,.35),transparent);
}
.card.active{
  outline:1px solid rgba(98,219,130,.78);
  box-shadow:0 0 0 1px rgba(98,219,130,.18),0 0 32px var(--glow),0 18px 55px rgba(0,0,0,.34);
}
.card h2{
  font-size:clamp(19px,2.4vw,28px);
  line-height:1.05;
  margin-bottom:4px;
}
.hpbar{
  height:18px;
  background:#2d1613;
  border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
}
.hpfill{
  background:linear-gradient(90deg,#ef5045,#ff9a62 70%,#ffc17c);
  box-shadow:0 0 14px rgba(255,111,82,.23);
}
.stats{
  gap:8px;
}
.stat{
  border:1px solid rgba(255,255,255,.045);
  background:linear-gradient(180deg,#081912,#06110d);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
.stat b{
  color:var(--gold2);
}
.ability{
  background:linear-gradient(180deg,#091a14,#06120e);
  border-color:rgba(102,224,145,.16);
}
.atkBtn{
  border-color:rgba(255,255,255,.055);
  background:linear-gradient(180deg,#0b1e16,#07150f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
.atkBtn.selected{
  outline:2px solid rgba(255,215,106,.75);
  background:
    linear-gradient(180deg,rgba(255,215,106,.08),rgba(255,215,106,.025)),
    #0b1b14;
  box-shadow:0 0 18px rgba(255,215,106,.09);
}
.center{
  background:linear-gradient(180deg,rgba(255,255,255,.012),transparent);
  border-radius:18px;
  padding:8px;
}
.die{
  box-shadow:
    0 14px 30px rgba(0,0,0,.35),
    inset 0 2px 3px rgba(255,255,255,.85),
    inset 0 -5px 8px rgba(0,0,0,.10);
}
.roll{
  box-shadow:0 9px 24px rgba(225,178,53,.18),inset 0 1px 0 rgba(255,255,255,.28);
}
.result{
  border-color:rgba(255,215,106,.24);
  background:
    radial-gradient(circle at 50% -40%,rgba(255,215,106,.08),transparent 55%),
    linear-gradient(180deg,var(--panelA),var(--panelB));
}
.result h3{
  letter-spacing:.05em;
}
.event{
  border-radius:14px;
  box-shadow:0 12px 26px rgba(0,0,0,.20);
}
.historyCard{
  background:
    linear-gradient(180deg,rgba(255,255,255,.018),transparent),
    #081711;
  border-color:rgba(102,224,145,.17);
}

    display:flex;

  }
  #battleScreen .center{order:-1}

  #battleScreen .card h2{font-size:20px}

  }
  #battleScreen .ability{font-size:10px;padding:6px}
  #battleScreen .attacks{gap:6px}
  #battleScreen .atkBtn{padding:8px;font-size:13px}
  #battleScreen .atkBtn small{font-size:10px}
  #battleScreen .stats{gap:5px;margin:6px 0}
  #battleScreen .stat{padding:5px;font-size:10px}
  #battleScreen .stat b{font-size:17px}
  #battleScreen .dice{gap:12px}
  #battleScreen .die{width:76px;height:76px;font-size:39px}
  #battleScreen .roll{min-height:46px}

/* iPad portrait */
@media (min-width:600px) and (max-width:899px){
  .app{padding:10px 12px}
  .selectionGrid{grid-template-columns:1fr auto 1fr;max-width:820px;margin:auto}
  #battleScreen .arena{
    grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);
    gap:8px;
  }
  #battleScreen .card{padding:10px}
  #battleScreen .card h2{font-size:19px}
  #battleScreen .abilityBox{max-height:110px}
  #battleScreen .ability{font-size:10px;padding:5px}
  #battleScreen .atkBtn{padding:7px;font-size:12px}
  #battleScreen .stat{padding:5px}
  #battleScreen .stat b{font-size:17px}
  #battleScreen .die{width:68px;height:68px;font-size:36px}
  #battleScreen .center{padding:5px}
  #battleScreen .result{min-height:95px}
}

/* iPad landscape / desktop */
@media (min-width:900px){
  .selectionGrid{max-width:980px;margin:auto}
  #battleScreen .arena{
    grid-template-columns:minmax(0,1fr) 230px minmax(0,1fr);
    gap:14px;
  }
  #battleScreen .abilityBox{max-height:170px}
  #battleScreen .die{width:88px;height:88px;font-size:46px}
}

/* Large desktop */
@media (min-width:1200px){
  .app{max-width:1320px}
  #battleScreen .arena{
    grid-template-columns:minmax(360px,1fr) 250px minmax(360px,1fr);
  }
}

/* ===== V8.1 TRUE iPhone battle layout ===== */
.mobileVsStrip{display:none}
.mobileFighter{
  flex:1;min-width:0;

/* ===== V9 PREMIUM JURASSIC GUI ===== */
:root{
  --bg:#030806;
  --bg2:#07120e;
  --panel:#0b1a14;
  --panel2:#10251c;
  --panel3:#142f24;
  --line:rgba(121,236,162,.22);
  --lineStrong:rgba(121,236,162,.48);
  --green:#73e493;
  --green2:#2fb865;
  --gold:#f4cf63;
  --gold2:#ffe79a;
  --orange:#ff9a59;
  --red:#ff5f57;
  --cyan:#70cfff;
  --text:#f4faf6;
  --muted:#9db2a6;
}

html,body{
  background:
    radial-gradient(circle at 50% -20%,rgba(46,138,86,.22),transparent 36%),
    radial-gradient(circle at 0% 20%,rgba(38,87,65,.18),transparent 28%),
    linear-gradient(180deg,#08140f 0%,#030806 52%,#010302 100%);
}

body{
  color:var(--text);
  letter-spacing:.005em;
}

.app{
  position:relative;
}

.app::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.008) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.28),transparent 72%);
}

h1,h2,h3,.battleTitle,.winnerName{
  font-weight:950;
  letter-spacing:.055em;
}

.selectionHero h1{
  color:#f7fbf8;
  text-shadow:
    0 0 30px rgba(115,228,147,.16),
    0 3px 0 rgba(0,0,0,.35);
}

.selectionHero h2{
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.panel,.card,.result{
  position:relative;
  background:
    linear-gradient(180deg,rgba(255,255,255,.025),transparent 35%),
    linear-gradient(180deg,rgba(15,38,28,.96),rgba(6,18,13,.98));
  border:1px solid var(--line);
  box-shadow:
    0 22px 55px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.panel::after,.card::after,.result::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:inherit;
  box-shadow:inset 0 0 40px rgba(80,190,120,.015);
}

.selectionGrid{
  border-radius:24px;
  overflow:hidden;
}

label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:#c5d3cb;
  font-weight:850;
}

select{
  background:
    linear-gradient(180deg,rgba(255,255,255,.035),transparent),
    #081711;
  border:1px solid rgba(115,228,147,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}

button{
  border-radius:13px;
  border:1px solid rgba(255,255,255,.075);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}

.primary{
  background:
    linear-gradient(180deg,rgba(255,255,255,.12),transparent 45%),
    linear-gradient(135deg,#2ba75b,#73dd8d);
  box-shadow:
    0 12px 30px rgba(42,180,92,.24),
    inset 0 1px 0 rgba(255,255,255,.25);
  letter-spacing:.045em;
}

.primary:active,.roll:active{
  filter:brightness(.96);
  transform:translateY(1px) scale(.995);
}

.battleTop{
  border-bottom:1px solid rgba(115,228,147,.10);
}

.battleTitle{
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 22px rgba(244,207,99,.09);
}

.backBtn,.historyBtn,.soundBtn{
  background:
    linear-gradient(180deg,rgba(255,255,255,.025),transparent),
    #0d2018;
  border-color:rgba(115,228,147,.22);
}

.card{
  border-radius:22px;
}

.card.active{
  border-color:rgba(115,228,147,.62);
  box-shadow:
    0 0 0 1px rgba(115,228,147,.11),
    0 0 34px rgba(74,211,120,.13),
    0 22px 55px rgba(0,0,0,.42);
}

.card.active::before{
  content:"ACTIVE";
  position:absolute;
  top:10px;
  right:12px;
  z-index:2;
  color:#051108;
  background:linear-gradient(180deg,#8bf0a6,#56d77b);
  border-radius:999px;
  padding:4px 8px;
  font-size:9px;
  font-weight:950;
  letter-spacing:.1em;
  box-shadow:0 0 18px rgba(115,228,147,.17);
}

.hpbar{
  height:19px;
  background:#23110f;
  border:1px solid rgba(255,255,255,.07);
  box-shadow:
    inset 0 3px 7px rgba(0,0,0,.35),
    0 0 0 1px rgba(0,0,0,.12);
}

.hpfill{
  background:
    linear-gradient(180deg,rgba(255,255,255,.20),transparent 42%),
    linear-gradient(90deg,#f14742,#ff7555 58%,#ffae70);
  box-shadow:0 0 18px rgba(255,91,73,.22);
}

.stats{
  background:rgba(0,0,0,.10);
  padding:5px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.025);
}

.stat{
  border-radius:10px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.022),transparent),
    #07130e;
}

.stat b{
  color:var(--gold);
  text-shadow:0 0 12px rgba(244,207,99,.12);
}

.abilityBox{
  position:relative;
}

.ability{
  border-radius:11px;
  background:
    linear-gradient(180deg,rgba(115,228,147,.025),transparent),
    #07150f;
  border-left:3px solid rgba(115,228,147,.40);
}

.ability em{
  color:var(--gold);
}

.ability strong{
  color:var(--green);
}

.atkBtn{
  position:relative;
  border-radius:13px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.025),transparent 44%),
    #081811;
  border:1px solid rgba(255,255,255,.055);
}

.atkBtn:hover{
  border-color:rgba(244,207,99,.22);
}

.atkBtn.selected{
  border-color:rgba(244,207,99,.78);
  outline:none;
  background:
    linear-gradient(90deg,rgba(244,207,99,.09),transparent 72%),
    linear-gradient(180deg,#132218,#0a1710);
  box-shadow:
    inset 4px 0 0 var(--gold),
    0 0 20px rgba(244,207,99,.09);
}

.atkBtn.selected::after{
  content:"SELECTED";
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  color:var(--gold);
  font-size:8px;
  font-weight:950;
  letter-spacing:.10em;
}

.center{
  position:relative;
}

.center::before{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:22px;
  pointer-events:none;
  background:radial-gradient(circle,rgba(244,207,99,.055),transparent 62%);
}

.dice{
  position:relative;
  z-index:1;
}

.die{
  background:
    linear-gradient(145deg,#ffffff,#efe8d7);
  border:4px solid #d7cdbb;
  box-shadow:
    0 18px 35px rgba(0,0,0,.42),
    inset 0 2px 4px rgba(255,255,255,.95),
    inset 0 -7px 12px rgba(0,0,0,.10);
}

.die.a{
  border-color:#e8bd48;
  box-shadow:
    0 18px 35px rgba(0,0,0,.42),
    0 0 18px rgba(232,189,72,.12),
    inset 0 2px 4px rgba(255,255,255,.95),
    inset 0 -7px 12px rgba(0,0,0,.10);
}

.die.d{
  border-color:#69b8ee;
  box-shadow:
    0 18px 35px rgba(0,0,0,.42),
    0 0 18px rgba(105,184,238,.11),
    inset 0 2px 4px rgba(255,255,255,.95),
    inset 0 -7px 12px rgba(0,0,0,.10);
}

.roll{
  position:relative;
  z-index:1;
  background:
    linear-gradient(180deg,rgba(255,255,255,.20),transparent 45%),
    linear-gradient(135deg,#d9a82e,#f6dc79);
  border:none;
  color:#171006;
  letter-spacing:.055em;
  box-shadow:
    0 12px 30px rgba(226,180,56,.21),
    inset 0 1px 0 rgba(255,255,255,.38);
}

.result{
  overflow:hidden;
}

.result::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:4px;
  height:100%;
  background:linear-gradient(180deg,var(--gold),var(--green));
}

.result h3{
  color:var(--gold);
}

.event{
  background:
    linear-gradient(180deg,rgba(255,255,255,.035),transparent),
    linear-gradient(135deg,#2b220b,#1a1708);
  border-color:rgba(244,207,99,.42);
  color:#ffe999;
}

.doubleEvent{
  box-shadow:
    0 0 0 1px rgba(244,207,99,.12),
    0 0 30px rgba(244,207,99,.19),
    0 14px 30px rgba(0,0,0,.30);
}

.historyCard{
  border-radius:16px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.018),transparent),
    #07150f;
  box-shadow:0 10px 26px rgba(0,0,0,.20);
}

.winnerName{
  color:var(--gold2);
}

.mobileFighter{
  background:
    linear-gradient(180deg,rgba(255,255,255,.025),transparent),
    linear-gradient(180deg,#10251c,#091811);
}

.mobileFighter.active{
  border-color:rgba(115,228,147,.55);
}

.mobileHpMini{
  background:#25110e;
}

.mobileHpMini > div{
  background:linear-gradient(90deg,#ef4e46,#ff9a62);
}

/* ===== V10 RADICAL VISUAL REDESIGN ===== */
:root{
  --j-bg:#020504;
  --j-bg2:#07110d;
  --j-panel:#0a1712;
  --j-panel2:#0f241b;
  --j-green:#76e59a;
  --j-green-deep:#1d7a49;
  --j-gold:#f6cf5d;
  --j-amber:#ff9b48;
  --j-red:#ff6257;
  --j-blue:#6cc7ff;
  --j-text:#f5fbf7;
  --j-muted:#9db0a5;
}
body{
  background:
    radial-gradient(circle at 50% -10%,rgba(50,120,76,.22),transparent 32%),
    linear-gradient(180deg,#06100c 0%,#020504 58%,#000 100%);
}
.app{max-width:1380px}
.screen{position:relative}

/* top game branding */
.selectionHero{
  margin:0 auto 18px;
  padding:22px 12px 18px;
  max-width:900px;
  border-bottom:1px solid rgba(118,229,154,.14);
}
.selectionHero h1{
  font-size:clamp(34px,7vw,62px);
  margin:0;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.selectionHero h2{
  margin:10px 0 4px;
  font-size:clamp(22px,4vw,34px);
  letter-spacing:.15em;
}
.selectionHero .muted{
  font-size:14px;
  letter-spacing:.04em;
}

/* selection panel becomes game lobby */
.selectionGrid{
  max-width:920px;
  margin:0 auto;
  padding:22px;
  border-radius:28px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.028),transparent 40%),
    linear-gradient(180deg,#10271e,#07130f);
  border:1px solid rgba(118,229,154,.22);
  box-shadow:0 24px 60px rgba(0,0,0,.42);
}
.selectionGrid > div:not(.vs){
  background:#07120e;
  border:1px solid rgba(255,255,255,.045);
  border-radius:18px;
  padding:14px;
}
.selectionGrid .vs{
  align-self:center;
  font-size:30px;
  padding:0 10px 14px;
  text-shadow:0 0 18px rgba(246,207,93,.2);
}
.selectionGrid label{
  margin-bottom:8px;
  color:var(--j-gold);
}
.selectionGrid select{
  min-height:56px;
  font-size:18px;
  border-radius:14px;
}
.selectionGrid .primary{
  min-height:58px;
  font-size:18px;
  border-radius:16px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

/* battle shell */
#battleScreen{
  padding-top:4px;
}
.battleTop{
  margin-bottom:8px;
  padding:10px;
  border:1px solid rgba(118,229,154,.16);
  border-radius:18px;
  background:rgba(6,15,11,.92);
}
.battleTitle{
  font-size:clamp(18px,2.4vw,28px);
  letter-spacing:.14em;
}

/* full desktop/ipad fighter cards */
#battleScreen .card{
  padding:16px;
  border-radius:24px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.026),transparent 42%),
    linear-gradient(180deg,#10261d,#07130f);
  border:1px solid rgba(118,229,154,.20);
}
#battleScreen .card h2{
  font-size:clamp(24px,2.5vw,34px);
  text-transform:uppercase;
  letter-spacing:.035em;
  margin-bottom:10px;
}
#battleScreen .card > .muted{
  display:inline-block;
  margin:5px 0 8px;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(118,229,154,.06);
  color:#b9ccc0;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

/* HP looks like a game meter */
.hpbar{
  height:24px;
  border-radius:9px;
  background:#1b0d0c;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
}
.hpfill{
  border-radius:8px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.20),transparent 44%),
    linear-gradient(90deg,#e94b42,#ff7657 58%,#ffb16e);
}
.card > b{
  display:block;
  margin-top:5px;
  font-size:18px;
}

/* stat tiles become compact HUD badges */
.stats{
  background:transparent;
  padding:0;
  margin:14px 0 10px;
}
.stat{
  padding:10px 5px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.05);
  background:
    linear-gradient(180deg,rgba(255,255,255,.02),transparent),
    #06110d;
}
.stat b{
  font-size:24px;
}

/* abilities feel like dossier data */
.abilityBox{
  gap:7px;
  margin:8px 0 12px;
}
.ability{
  padding:10px 11px;
  border-radius:12px;
  border-left:4px solid rgba(118,229,154,.55);
  background:#07140f;
}
.ability em{
  font-size:9px;
}
.ability strong{
  font-size:13px;
}

/* attacks are now game actions */
.attacks{
  gap:9px;
}
.atkBtn{
  min-height:64px;
  padding:12px 14px;
  border-radius:16px;
  font-size:15px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.025),transparent 45%),
    #091912;
  border:1px solid rgba(255,255,255,.065);
}
.atkBtn b{
  font-size:17px;
}
.atkBtn.selected{
  background:
    linear-gradient(90deg,rgba(246,207,93,.14),rgba(246,207,93,.025)),
    #0b1912;
  border-color:rgba(246,207,93,.85);
  box-shadow:
    inset 5px 0 0 var(--j-gold),
    0 0 24px rgba(246,207,93,.10);
}

/* central dice console */
#battleScreen .center{
  min-height:100%;
  padding:18px 12px;
  border:1px solid rgba(246,207,93,.12);
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 35%,rgba(246,207,93,.06),transparent 42%),
    linear-gradient(180deg,#0a1712,#050d09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
#turn{
  font-size:clamp(22px,2.6vw,32px);
  color:#fff;
  letter-spacing:.02em;
}
.dice{
  margin:14px 0 10px;
}
.die{
  width:100px;
  height:100px;
  font-size:52px;
  border-radius:22px;
}
.roll{
  min-height:58px;
  border-radius:16px;
  font-size:17px;
  text-transform:uppercase;
}

/* results become combat feed */
.result{
  border-radius:20px;
  padding:18px;
  background:
    linear-gradient(180deg,rgba(246,207,93,.035),transparent 40%),
    #07140f;
}
.result h3{
  font-size:21px;
  text-transform:uppercase;
}
.result .big{
  font-size:26px;
}

/* event banner */
.event{
  padding:12px 15px;
  font-size:14px;
  border-radius:16px;
}

/* history screen */
#historyScreen .panel{
  background:transparent;
  border:none;
  box-shadow:none;
  padding:0;
}
.historyList{
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:14px;
}
.historyCard{
  min-height:150px;
  padding:16px;
  border-radius:18px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.018),transparent),
    linear-gradient(180deg,#0d2119,#06120e);
}
.historyCard .winnerName{
  font-size:20px;
}

/* ===== V12 CINEMATIC ANIMATION + EFFECTS PASS ===== */

:root{
  --fx-green:#74f09a;
  --fx-gold:#ffd968;
  --fx-red:#ff5b52;
  --fx-blue:#76d6ff;
}

/* ambient animated background */
body::after{
  content:"";
  position:fixed;
  inset:-15%;
  z-index:-9;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 22%,rgba(66,214,116,.09),transparent 18%),
    radial-gradient(circle at 80% 16%,rgba(255,217,104,.055),transparent 15%),
    radial-gradient(circle at 68% 74%,rgba(42,130,87,.07),transparent 20%);
  filter:blur(18px);
  animation:ambientDrift 18s ease-in-out infinite alternate;
}

@keyframes ambientDrift{
  0%{transform:translate3d(-1.5%,-1%,0) scale(1)}
  50%{transform:translate3d(1%,1.5%,0) scale(1.04)}
  100%{transform:translate3d(2%,-.5%,0) scale(1.02)}
}

/* subtle scan texture */
.app::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  opacity:.12;
  background:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.012) 0,
      rgba(255,255,255,.012) 1px,
      transparent 1px,
      transparent 4px
    );
  mix-blend-mode:soft-light;
}

/* screen transitions */
.screen.active{
  animation:screenEnter .38s cubic-bezier(.2,.75,.2,1);
}
@keyframes screenEnter{
  from{opacity:0;transform:translateY(8px) scale(.992)}
  to{opacity:1;transform:none}
}

/* hero title shimmer */
.selectionHero h1{
  position:relative;
  overflow:hidden;
}
.selectionHero h1::after{
  content:"";
  position:absolute;
  top:-20%;
  left:-35%;
  width:22%;
  height:140%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:skewX(-18deg);
  animation:titleShine 5.5s ease-in-out infinite;
}
@keyframes titleShine{
  0%,58%{left:-35%;opacity:0}
  65%{opacity:1}
  78%{left:115%;opacity:.7}
  100%{left:115%;opacity:0}
}

/* VS badge lives a little */
.vsOrb{
  animation:vsPulse 2.4s ease-in-out infinite;
}
@keyframes vsPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 4px rgba(246,207,93,.04),0 8px 20px rgba(0,0,0,.30),0 0 18px rgba(246,207,93,.10)}
  50%{transform:scale(1.045);box-shadow:0 0 0 6px rgba(246,207,93,.07),0 10px 26px rgba(0,0,0,.32),0 0 30px rgba(246,207,93,.21)}
}

/* fighter preview reveal */
.fighterPreview:not(.empty){
  animation:previewReveal .32s cubic-bezier(.2,.8,.2,1);
}
@keyframes previewReveal{
  from{opacity:0;transform:translateY(6px) scale(.985)}
  to{opacity:1;transform:none}
}
.previewStat{
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
}
.previewStat:hover{
  transform:translateY(-2px);
  border-color:rgba(246,207,93,.22);
  background:#091711;
}

/* panel edge glow breathing */
.selectionGrid,.card,.result,.historyCard{
  position:relative;
}
.selectionGrid::before,.card::before,.result::before,.historyCard::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 10%,rgba(115,228,147,.10),transparent 45%,rgba(246,207,93,.07),transparent 85%);
  opacity:.45;
  filter:blur(8px);
  animation:edgeGlow 5s ease-in-out infinite alternate;
}
@keyframes edgeGlow{
  from{opacity:.18}
  to{opacity:.48}
}

/* buttons feel game-like */
button{
  position:relative;
  overflow:hidden;
}
button::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 35%);
  opacity:.35;
}
button:hover{
  filter:brightness(1.06);
}
button:active{
  transform:translateY(1px) scale(.985);
}

/* CTA glow */
.selectionFooter .primary,.roll{
  animation:ctaGlow 2.8s ease-in-out infinite;
}
@keyframes ctaGlow{
  0%,100%{box-shadow:0 10px 26px rgba(50,190,98,.18),inset 0 1px 0 rgba(255,255,255,.18)}
  50%{box-shadow:0 12px 34px rgba(70,220,120,.32),0 0 24px rgba(70,220,120,.10),inset 0 1px 0 rgba(255,255,255,.22)}
}

/* attack selection */
.atkBtn{
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;
}
.atkBtn:active{
  transform:scale(.985);
}
.atkBtn.selected{
  animation:selectedAttack 1.8s ease-in-out infinite;
}
@keyframes selectedAttack{
  0%,100%{box-shadow:inset 5px 0 0 var(--j-gold),0 0 18px rgba(246,207,93,.08)}
  50%{box-shadow:inset 5px 0 0 var(--j-gold),0 0 28px rgba(246,207,93,.19)}
}

/* dice animation classes */
.die{
  will-change:transform;
}
.die.rolling{
  animation:diceRollFx .62s cubic-bezier(.2,.8,.2,1);
}
@keyframes diceRollFx{
  0%{transform:rotate(0deg) scale(1)}
  18%{transform:rotate(90deg) scale(1.12) translateY(-4px)}
  42%{transform:rotate(205deg) scale(.96) translateX(3px)}
  68%{transform:rotate(320deg) scale(1.08) translateY(-2px)}
  100%{transform:rotate(360deg) scale(1)}
}

/* hit / block / crit flash classes */
.card.fx-hit{
  animation:hitFlash .34s ease;
}
@keyframes hitFlash{
  0%{filter:brightness(1)}
  35%{filter:brightness(1.55);transform:translateX(-4px)}
  65%{transform:translateX(3px)}
  100%{filter:brightness(1);transform:none}
}
.card.fx-block{
  animation:blockFlash .38s ease;
}
@keyframes blockFlash{
  0%{box-shadow:0 0 0 rgba(118,214,255,0)}
  40%{box-shadow:0 0 0 3px rgba(118,214,255,.24),0 0 34px rgba(118,214,255,.22)}
  100%{box-shadow:0 0 0 rgba(118,214,255,0)}
}
.card.fx-crit{
  animation:critFlash .48s ease;
}
@keyframes critFlash{
  0%{filter:brightness(1)}
  25%{filter:brightness(1.75) saturate(1.35);transform:scale(1.015)}
  55%{filter:brightness(1.2)}
  100%{filter:none;transform:none}
}

/* low HP danger */
.card.lowHp{
  animation:lowHpPulse 1.35s ease-in-out infinite;
}
@keyframes lowHpPulse{
  0%,100%{box-shadow:0 0 0 rgba(255,91,82,0)}
  50%{box-shadow:0 0 0 1px rgba(255,91,82,.34),0 0 30px rgba(255,91,82,.15)}
}

/* result/event entrance */
.result.fx-update{
  animation:resultPop .34s cubic-bezier(.2,.8,.2,1);
}
@keyframes resultPop{
  from{opacity:.35;transform:translateY(5px) scale(.992)}
  to{opacity:1;transform:none}
}
.event{
  animation:eventDrop .34s cubic-bezier(.2,.8,.2,1);
}
@keyframes eventDrop{
  from{opacity:0;transform:translateY(-7px) scale(.985)}
  to{opacity:1;transform:none}
}

/* winner emphasis */
.winnerName{
  animation:winnerGlow 2s ease-in-out infinite;
}
@keyframes winnerGlow{
  0%,100%{text-shadow:0 0 8px rgba(246,207,93,.08)}
  50%{text-shadow:0 0 18px rgba(246,207,93,.22)}
}

/* motion reduction */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
  }
}

/* ===== V12.1 OBVIOUS EFFECTS ===== */

/* visibly moving background glow */
.fxAurora{
  position:fixed;
  inset:0;
  z-index:-8;
  pointer-events:none;
  overflow:hidden;
}
.fxAurora::before,
.fxAurora::after{
  content:"";
  position:absolute;
  width:55vw;
  height:55vw;
  border-radius:50%;
  filter:blur(55px);
  opacity:.22;
}
.fxAurora::before{
  background:#32d978;
  left:-18vw;
  top:7vh;
  animation:auroraA 9s ease-in-out infinite alternate;
}
.fxAurora::after{
  background:#d7ad35;
  right:-25vw;
  top:42vh;
  opacity:.11;
  animation:auroraB 11s ease-in-out infinite alternate;
}
@keyframes auroraA{
  from{transform:translate(0,0) scale(.85)}
  to{transform:translate(38vw,18vh) scale(1.25)}
}
@keyframes auroraB{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(-30vw,-24vh) scale(1.18)}
}

/* obvious animated border sweep */
.selectionGrid,.fighterPreview,.card,.result{
  overflow:hidden;
}
.selectionGrid > .fxBorder,
.card > .fxBorder,
.result > .fxBorder{
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  z-index:5;
}
.fxBorder::before{
  content:"";
  position:absolute;
  width:42%;
  height:220%;
  top:-60%;
  left:-55%;
  background:linear-gradient(90deg,transparent,rgba(115,240,155,.45),transparent);
  transform:rotate(14deg);
  animation:borderSweep 4.5s ease-in-out infinite;
}
@keyframes borderSweep{
  0%,55%{left:-55%;opacity:0}
  62%{opacity:.85}
  82%{left:120%;opacity:.55}
  100%{left:120%;opacity:0}
}

/* proper dice tumble */
.die.rolling{
  animation:diceTumble 1.45s cubic-bezier(.18,.8,.2,1) !important;
}
@keyframes diceTumble{
  0%{transform:perspective(400px) rotateX(0) rotateY(0) rotateZ(0) translateY(0) scale(1)}
  15%{transform:perspective(400px) rotateX(130deg) rotateY(80deg) rotateZ(45deg) translateY(-13px) scale(1.14)}
  34%{transform:perspective(400px) rotateX(260deg) rotateY(210deg) rotateZ(120deg) translateY(4px) scale(.92)}
  53%{transform:perspective(400px) rotateX(420deg) rotateY(330deg) rotateZ(230deg) translateY(-8px) scale(1.08)}
  72%{transform:perspective(400px) rotateX(590deg) rotateY(475deg) rotateZ(315deg) translateY(2px) scale(.97)}
  88%{transform:perspective(400px) rotateX(690deg) rotateY(560deg) rotateZ(355deg) translateY(-3px) scale(1.03)}
  100%{transform:perspective(400px) rotateX(720deg) rotateY(720deg) rotateZ(360deg) translateY(0) scale(1)}
}

/* global combat overlay */
#combatFx{
  position:fixed;
  inset:0;
  z-index:999;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
}
#combatFx .fxText{
  opacity:0;
  transform:scale(.6);
  font-size:clamp(34px,10vw,78px);
  line-height:.9;
  font-weight:1000;
  letter-spacing:.04em;
  text-align:center;
  text-shadow:0 5px 20px rgba(0,0,0,.7);
}
#combatFx.show .fxText{
  animation:combatText .82s cubic-bezier(.16,.85,.2,1);
}
@keyframes combatText{
  0%{opacity:0;transform:scale(.55) translateY(12px)}
  25%{opacity:1;transform:scale(1.12) translateY(0)}
  70%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.95) translateY(-10px)}
}
#combatFx.hit .fxText{color:#ff796c}
#combatFx.crit .fxText{color:#ffe06d;text-shadow:0 0 28px rgba(255,221,92,.55),0 5px 20px #000}
#combatFx.block .fxText{color:#79d4ff;text-shadow:0 0 26px rgba(93,196,255,.45),0 5px 20px #000}
#combatFx.miss .fxText{color:#d4ddd7}
#combatFx.event .fxText{color:#93f4aa}

/* whole-screen flashes */
#screenFlash{
  position:fixed;
  inset:0;
  z-index:998;
  opacity:0;
  pointer-events:none;
}
#screenFlash.hit{animation:flashHit .36s ease}
#screenFlash.crit{animation:flashCrit2 .48s ease}
#screenFlash.block{animation:flashBlock .30s ease}
@keyframes flashHit{
  0%,100%{opacity:0;background:rgba(255,79,68,0)}
  25%{opacity:1;background:rgba(255,79,68,.18)}
}
@keyframes flashCrit2{
  0%,100%{opacity:0;background:rgba(255,211,70,0)}
  20%{opacity:1;background:rgba(255,226,90,.28)}
  45%{opacity:.35;background:#fff}
}
@keyframes flashBlock{
  0%,100%{opacity:0;background:rgba(80,180,255,0)}
  30%{opacity:1;background:rgba(80,180,255,.16)}
}

/* stronger card damage shake */
.card.fx-hit{
  animation:damageShake .46s cubic-bezier(.2,.75,.2,1) !important;
}
@keyframes damageShake{
  0%{transform:translateX(0);filter:brightness(1)}
  18%{transform:translateX(-9px) rotate(-.4deg);filter:brightness(1.65)}
  34%{transform:translateX(7px) rotate(.35deg)}
  51%{transform:translateX(-5px)}
  68%{transform:translateX(3px)}
  100%{transform:translateX(0);filter:brightness(1)}
}
.card.fx-crit{
  animation:criticalShake .58s cubic-bezier(.2,.75,.2,1) !important;
}
@keyframes criticalShake{
  0%{transform:scale(1);filter:none}
  18%{transform:scale(1.035) translateX(-10px);filter:brightness(1.8) saturate(1.4)}
  36%{transform:scale(1.02) translateX(9px)}
  55%{transform:scale(1.025) translateX(-6px)}
  75%{transform:scale(1.01) translateX(3px)}
  100%{transform:none;filter:none}
}

/* prominent low HP alert */
.card.lowHp{
  animation:dangerPulse 1s ease-in-out infinite !important;
}
@keyframes dangerPulse{
  0%,100%{box-shadow:0 0 0 1px rgba(255,78,70,.24),0 0 16px rgba(255,78,70,.07)}
  50%{box-shadow:0 0 0 2px rgba(255,78,70,.65),0 0 38px rgba(255,78,70,.27)}
}

/* selection previews visibly animate when changed */
.fighterPreview:not(.empty){
  animation:previewPop .42s cubic-bezier(.12,.85,.2,1) !important;
}
@keyframes previewPop{
  0%{opacity:.1;transform:scale(.94) translateY(8px)}
  65%{transform:scale(1.02) translateY(0)}
  100%{opacity:1;transform:scale(1)}
}

/* selected attack animated gold edge */
.atkBtn.selected{
  animation:attackGlowStrong 1.1s ease-in-out infinite !important;
}
@keyframes attackGlowStrong{
  0%,100%{border-color:rgba(246,207,93,.65);box-shadow:inset 5px 0 0 #f6cf5d,0 0 12px rgba(246,207,93,.10)}
  50%{border-color:#ffe684;box-shadow:inset 5px 0 0 #ffe684,0 0 32px rgba(246,207,93,.32)}
}

/* ===== V12.2 FX LAYERING FIX ===== */
.selectionGrid,
.fighterSelectWrap,
.fighterPreview,
.card,
.result{
  isolation:isolate;
}

.selectionGrid > .fxBorder,
.card > .fxBorder,
.result > .fxBorder{

}

}

.selectionGrid::before,
.card::before,
.result::before,
.historyCard::before{
  z-index:0 !important;
}

.fxBorder,
.fxBorder::before{
  pointer-events:none !important;
}

let soundOn = localStorage.getItem("jurassicSound") !== "off";
let audioCtx=null;
function ensureAudio(){
  if(!soundOn)return null;
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  return audioCtx;
}
function tone(freq=440,dur=.1,type="sine",gain=.08,delay=0){
  let c=ensureAudio(); if(!c)return;
  let o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+delay);
  g.gain.setValueAtTime(0.0001,c.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(gain,c.currentTime+delay+.01);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+delay+dur);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur+.02);
}

function playRealSfx(id, volume=0.9){
  if(!soundOn)return;
  const el=document.getElementById(id);
  if(!el)return;
  try{
    el.pause();
    el.currentTime=0;
    el.volume=volume;
    const p=el.play();
    if(p && p.catch)p.catch(()=>{});
  }catch(e){}
}
function sfx(name){
  if(!soundOn)return;
  if(name==="roll"){tone(180,.06,"square",.04,0);tone(230,.06,"square",.04,.07);tone(290,.07,"square",.04,.14)}
  if(name==="hit"){tone(95,.12,"sawtooth",.09,0);tone(65,.15,"square",.05,.04)}
  if(name==="heavy"){tone(70,.18,"sawtooth",.12,0);tone(45,.22,"square",.08,.06)}
  if(name==="crit"){tone(520,.09,"square",.07,0);tone(680,.1,"square",.08,.1);tone(880,.14,"square",.09,.2)}
  if(name==="block"){tone(240,.08,"triangle",.06,0);tone(180,.12,"triangle",.05,.07)}
  if(name==="event"){tone(330,.08,"sine",.06,0);tone(440,.08,"sine",.06,.09);tone(660,.12,"sine",.07,.18)}
  if(name==="win"){tone(392,.12,"square",.06,0);tone(523,.12,"square",.06,.13);tone(659,.14,"square",.07,.26);tone(784,.24,"square",.08,.4)}
}

function getDefences(name){
  return defenceProfiles[name]||[
    D("Brace","Reliable defence; committed attacks can break it.",4,{committed:-2},2),
    D("Evade","Strong against committed attacks; weak against fast attacks.",0,{committed:5,fast:-4},0,1,null,true),
    D("Read","Strong against close attacks; weak against ranged attacks.",2,{close:3,ranged:-3},1)
  ];
}
function attackTags(move){
  const tags=new Set([move.kind]);
  if(["bite","claw","body","horn","tail","charge","stomp","heavy"].includes(move.kind))tags.add("close");
  if(move.effect==="heavy"||["charge","stomp","heavy"].includes(move.kind)||(move.power>=15&&move.acc<=0))tags.add("committed");
  if(["speed","aerial"].includes(move.kind)||move.acc>=2)tags.add("fast");
  if(move.acc>=2)tags.add("accurate");
  if(move.kind==="ranged")tags.add("ranged");
  if(["pierce2","pierce3","pierce4","defdown2","defdown3"].includes(move.effect))tags.add("piercing");
  if(["poison","slow2","defdown2","defdown3","mutation","stun_chance"].includes(move.effect))tags.add("status");
  if(["slow2","defdown2","defdown3"].includes(move.effect))tags.add("control");
  return tags;
}
function attackType(move){
  const t=attackTags(move);
  if(t.has("committed"))return "HEAVY";
  if(t.has("fast"))return "FAST";
  if(t.has("piercing")||t.has("status"))return "TACTICAL";
  return "BALANCED";
}
function attackHint(move){
  const t=attackTags(move);
  if(t.has("committed"))return "High impact • vulnerable to the right evade";
  if(t.has("fast"))return "Fast/accurate • hunts evasive defence";
  if(t.has("piercing"))return "Technical • pressures armour and guard";
  if(t.has("status"))return "Tactical • trades raw power for an effect";
  return "Reliable middle option";
}
function defenceOutcome(defender,attacker,defence,move){
  const tags=attackTags(move);
  let mod=defence.base||0;
  for(const [tag,val] of Object.entries(defence.mods||{}))if(tags.has(tag))mod+=val;
  if(defence.speed){
    const gap=(defender.spd+(defender.spdMod||0))-(attacker.spd+(attacker.spdMod||0));
    mod+=Math.max(-2,Math.min(2,gap));
  }
  return {mod:Math.max(-4,Math.min(10,mod)),reduce:defence.reduce||0,gate:defence.gate||0};
}
function counterEligible(defence,move,ar,dr,atkTotal=null,defTotal=null){
  const c=defence?.counter;if(!c)return false;
  const tags=attackTags(move);
  if(!c.tags.some(t=>tags.has(t)))return false;
  const margin=(atkTotal!==null&&defTotal!==null)?defTotal-atkTotal:(dr-ar);
  return ar===1||dr===6||margin>=c.minMargin;
}
function offerCounter(a,d,move,defence,ar,dr,atkTotal=null,defTotal=null){
  if(!counterEligible(defence,move,ar,dr,atkTotal,defTotal))return false;
  S.phase="counter";
  S.pendingCounter={owner:1-S.turn,target:S.turn,counter:defence.counter};
  combatOverlay("COUNTER!","event");
  $("#result").innerHTML=`<div class="counterPrompt">
    <strong>⚡ COUNTER OPPORTUNITY</strong>
    <p><b>${d.name}</b> earned <b>${defence.counter.name}</b>. Rare opening — take it or hold position.</p>
    <div class="counterActions">
      <button id="takeCounter" class="counterTake">USE ${defence.counter.name}</button>
      <button id="skipCounter" class="counterSkip">Decline</button>
    </div></div>`;
  render();
  setTimeout(()=>{
    $("#takeCounter")?.addEventListener("click",takeCounter);
    $("#skipCounter")?.addEventListener("click",()=>{S.pendingCounter=null;next();});
  },0);
  return true;
}
function takeCounter(){
  if(!S?.pendingCounter)return;
  const p=S.pendingCounter,owner=S.f[p.owner],target=S.f[p.target];
  const r=d6(),damage=Math.min(18,p.counter.power+r+Math.floor(owner.atk/14));
  target.hp=Math.max(0,target.hp-damage);
  S.biggestHit=Math.max(S.biggestHit||0,damage);
  flashScreen("crit");combatOverlay(p.counter.name,"crit");
  log(`${owner.name} used <b>${p.counter.name}</b> → ${damage} counter damage. ${target.name}: ${target.hp} HP.`);
  $("#result").innerHTML=`<h3>${p.counter.name}</h3><span class="big">${damage} COUNTER DAMAGE</span><br>Counter roll: <b>${r}</b><br><span class="remain">${target.name}: ${target.hp} HP LEFT</span>`;
  S.pendingCounter=null;
  if(target.hp<=0){
    S.over=true;sfx("win");saveBattleRecord(owner,target);
    $("#result").innerHTML+=`<br><br><span class="big">🏆 ${owner.name} WINS!</span>`;
    render();return;
  }
  next();
}

  const change=$("#changeFighters");if(change)change.addEventListener("click",()=>window.location.assign("./index.html"));
  const hist=$("#historyFromBattle");if(hist)hist.addEventListener("click",()=>openHistory("#battleScreen"));
  const back=$("#historyBack");if(back)back.addEventListener("click",()=>showScreen("#battleScreen"));
  const clear=$("#clearHistory");if(clear)clear.addEventListener("click",()=>{if(confirm("Clear all battle history?")){localStorage.removeItem(HIST_KEY);renderBattleHistory()}});
  const snd=$("#soundToggleBattle");if(snd)snd.addEventListener("click",toggleSound);

  try{start();updateSoundButtons();installFxBorders()}
  catch(e){
    console.error("Battle startup error:",e);
    if($("#result"))$("#result").innerHTML=
      `<h3>Battle could not start</h3><div class="muted">${String(e && e.message ? e.message : e)}</div>`;
  }
});
</script>
</body></html>
