function card(el,f,i){let active=S&&!S.over&&S.turn===i;el.className="card"+(active?" active":"");if(!f){el.innerHTML="No fighter";return}
el.innerHTML=`<h2>${f.name}</h2><div class="hpbar"><div class="hpfill" style="width:${f.hp}%"></div></div><b>${f.hp}/100 HP</b>
<div class="stats"><div class="stat">ATK<b>${f.atk}</b></div><div class="stat">DEF<b>${f.def}</b></div><div class="stat">SPD<b>${f.spd}</b></div></div><div class="muted">${f.trait}</div>
<div class="abilityBox">${(f.abilities||[]).map(x=>`<div class="ability"><em>${x.type}</em> <strong>${x.name}</strong><br>${x.text}</div>`).join("")}</div>
<div class="attacks">${f.attacks.map((a,j)=>`<button class="atkBtn ${active&&f.selected===j?"selected":""}" data-i="${i}" data-j="${j}" ${!active?"disabled":""}><b>${a.n}</b> · Power ${a.power} · Accuracy ${a.acc>=0?"+":""}${a.acc}<small>${a.note||""}</small></button>`).join("")}</div>`;
document.querySelectorAll(".atkBtn").forEach(b=>b.onclick=()=>{S.f[+b.dataset.i].selected=+b.dataset.j;render()})}
function render(){if(!S){card($("#c1"),null,0);card($("#c2"),null,1);$("#roll").disabled=true;return}card($("#c1"),S.f[0],0);card($("#c2"),S.f[1],1);$("#roll").disabled=S.over;$("#turn").textContent=S.over?"BATTLE OVER":S.f[S.turn].name+"'s turn"}
function log(x){let e=document.createElement("div");e.className="logentry";e.innerHTML=x;$("#history").prepend(e)}
function start(){if($("#p1").value===$("#p2").value)return alert("Choose different dinosaurs.");let a=F(dinos[$("#p1").value]),b=F(dinos[$("#p2").value]);let first=(a.spd===b.spd?d6()>=4:a.spd>b.spd)?0:1;S={f:[a,b],turn:first,over:false,round:1,firstHit:true};$("#history").innerHTML="";let m=matchups[key(a.name,b.name)];$("#matchEvent").innerHTML=m?`<div class="event"><b>${m.title}</b> — ${m.text}</div>`:"";$("#result").innerHTML=`<h3>Battle begins</h3>${S.f[first].name} attacks first.`;render()}

function doublesEvent(ar,dr,a,d){
 if(ar!==dr)return {extra:0,atk:0,def:0,skip:false,text:""};
 let ev={extra:0,atk:0,def:0,skip:false,text:""};
 if(ar===1){ev.skip=true;ev.text="DOUBLE 1 — CHAOTIC COLLISION! The attack fails and both dinosaurs take 4 damage.";a.hp=Math.max(0,a.hp-4);d.hp=Math.max(0,d.hp-4)}
 if(ar===2){ev.atk=4;ev.text="DOUBLE 2 — FEINT! The attacker reads the defence and gains +4 ATK."}
 if(ar===3){ev.extra=7;ev.text="DOUBLE 3 — MOMENTUM! A successful strike deals +7 damage."}
 if(ar===4){a.hp=Math.min(100,a.hp+6);ev.text="DOUBLE 4 — ADRENALINE SURGE! The attacker recovers 6 HP."}
 if(ar===5){ev.extra=10;ev.text="DOUBLE 5 — FEROCIOUS COMBO! A successful hit deals +10 damage."}
 if(ar===6){ev.extra=16;ev.atk=3;ev.text="DOUBLE 6 — LEGENDARY CLASH! +3 ATK and +16 damage if the hit lands."}
 $("#matchEvent").innerHTML=`<div class="event doubleEvent"><b>${ev.text}</b></div>`;
 return ev;
}
function resolve(ar,dr){let a=S.f[S.turn],d=S.f[1-S.turn],move=a.attacks[a.selected],m=matchups[key(a.name,d.name)],notes=[],bonus=a.nextAtk||0,extra=a.nextDmg||0,pierce=0;
a.nextAtk=0;a.nextDmg=0;
let dbl=doublesEvent(ar,dr,a,d);bonus+=dbl.atk;extra+=dbl.extra;if(dbl.text)notes.push(dbl.text);
if(dbl.skip){$("#result").classList.add("flashCrit");setTimeout(()=>$("#result").classList.remove("flashCrit"),500);$("#result").innerHTML=`<h3>DOUBLE EVENT!</h3><span class="big">${dbl.text}</span><br><span class="remain">${a.name}: ${a.hp} HP • ${d.name}: ${d.hp} HP</span>`;log(dbl.text);if(a.hp<=0||d.hp<=0){S.over=true;return render()}return next();}
if(a.poison){a.hp=Math.max(0,a.hp-a.poison);notes.push(`${a.name} suffers ${a.poison} poison damage`);a.poison=0}
if(move.effect==="reroll1"&&ar===1){ar=d6();$("#ad").textContent=ar;notes.push("rerolled attack 1")}
if(ar===1){$("#result").innerHTML=`<h3>MISS</h3><span class="big">${a.name}'s ${move.n} misses.</span><br><span class="remain">${d.name}: ${d.hp} HP left</span>`;log(`${a.name}: ${move.n} → MISS`);return next()}
if(move.effect==="fastbonus"&&(a.spd+a.spdMod)>(d.spd+d.spdMod))extra+=5;
if(move.effect==="fastbonus4"&&(a.spd+a.spdMod)>(d.spd+d.spdMod))extra+=4;
if(move.effect==="fastbonus5"&&(a.spd+a.spdMod)>(d.spd+d.spdMod))extra+=5;
if(move.effect==="fastbonus8"&&(a.spd+a.spdMod)>(d.spd+d.spdMod))extra+=8;
if(move.effect==="anti_fast"&&(d.spd+d.spdMod)>=8)extra+=6;
if(move.effect==="vs_tank5"&&d.def>=28)extra+=5;
if(move.effect==="lowhp4"&&a.hp<50)extra+=4;if(move.effect==="lowhp5"&&a.hp<50)extra+=5;
if(move.effect==="pierce4")pierce=4;if(move.effect==="pierce3")pierce=3;if(move.effect==="pierce2")pierce=2;
if(move.effect==="die56bonus"&&ar>=5)extra+=5;if(move.effect==="crit10"&&ar===6)extra+=10;

// Dinosaur-specific ability logic
if(a.name==="T. rex" && move.kind==="bite") extra+=2;
if(a.name==="T. rex" && move.n==="Crushing Bite" && ar===6) extra+=10;
if(a.name==="Scorpios Rex" && a.hp<50 && move.effect==="poison") d.poison=7;
if(a.name==="Indominus Rex" && move.n==="Ambush" && a.spd>d.spd) extra+=6;
if(a.name==="Brachiosaurus") d.damageShield=Math.max(d.damageShield||0,0);
if(a.name==="Suchomimus" && move.kind==="claw") pierce+=2;
if(a.name==="Kentrosaurus" && d.spd>=8) bonus+=3;
if(a.name==="Giganotosaurus" && ["T. rex","Indominus Rex"].includes(d.name)) extra+=3;
if(a.name==="Spinosaurus – Tail Strike" && d.name==="T. rex" && move.kind==="tail") extra+=5;
if(a.name==="Distortus Rex" && a.hp<40){bonus+=4;a.guard+=2}
if(a.name==="Stegosaurus" && d.name==="T. rex" && move.kind==="tail") extra+=3;
if(a.name==="Therizinosaurus" && ["T. rex","Giganotosaurus"].includes(d.name) && move.kind==="claw") extra+=4;
if(a.name==="Eotriceratops" && a.hp<40)a.guard+=4;
if(a.name==="Ceratosaurus male" && d.name==="Ceratosaurus female")bonus+=3;
if(a.name==="Ceratosaurus female" && d.atk>=30)a.guard+=2;
if(a.name==="Tyrannotitan" && d.hp<30 && move.kind==="bite")extra+=5;
if(a.name==="Gorgosaurus" && d.hp<35)bonus+=3;
if(a.name==="Allosaurus" && move.kind==="bite")extra+=2;
if(move.effect==="mutation"){let r=d6();if(r<=2){a.hp=Math.min(100,a.hp+8);notes.push("Mutation healed 8 HP")}else extra+=8}
if(m){if(m.bonus)extra+=m.bonus;if(m.crit&&ar===6)extra+=m.crit;if(m.atkBoth)bonus+=m.atkBoth;if(m.trexAtk&&a.name==="T. rex")bonus+=m.trexAtk;if(m.indoDef&&d.name==="Indominus Rex")d.guard+=m.indoDef;if(m.stegoDefVsBite&&d.name==="Stegosaurus"&&move.kind==="bite")d.guard+=m.stegoDefVsBite;if(m.claw&&a.name==="Therizinosaurus"&&move.kind==="claw")extra+=m.claw;if(m.bite&&a.name==="T. rex"&&move.kind==="bite")extra+=m.bite}
let atkTotal=a.atk+move.power+move.acc+ar+bonus,defTotal=Math.max(0,d.def+d.defMod+d.guard-pierce)+dr+(dr===6?5:0);d.guard=0;
let margin=atkTotal-defTotal,damage=0,crit=ar===6;
if(margin>0){damage=Math.max(6,Math.round(margin*1.25)+extra+(crit?8:0));if(move.effect==="min10")damage=Math.max(10,damage);if(m&&m.firstHit&&S.firstHit){damage+=m.firstHit;S.firstHit=false}
if(d.name==="Brachiosaurus")damage=Math.max(0,damage-4);
d.lastDamageTaken=damage;
d.hp=Math.max(0,d.hp-damage);
if(d.name==="Pteranodon" && damage>=15)d.guard+=4;
if(d.name==="Quetzalcoatlus" && damage>=15)d.guard+=4;
if(d.name==="Scorpios Rex" && damage>=20)d.nextAtk+=5;
if(d.name==="Giganotosaurus" && damage>=15)d.nextAtk+=3;
if(move.effect==="poison")d.poison=Math.max(d.poison||0,5);if(move.effect==="slow2")d.spdMod=-2;if(move.effect==="defdown3")d.defMod=-3;if(move.effect==="defdown2")d.defMod=-2;if(move.effect==="guard6")a.guard=6;if(move.effect==="guard8")a.guard=8;if(move.effect==="guard5")a.guard=5;
$("#result").innerHTML=`<h3>${crit?"CRITICAL HIT!":"HIT!"}</h3><span class="big">${a.name} used ${move.n}</span><br>Attack ${ar} → <b>${atkTotal}</b> vs Defence ${dr} → <b>${defTotal}</b><br><span class="damage big">${damage} DAMAGE</span><br><span class="remain big">${d.name}: ${d.hp} HP LEFT</span>${notes.length?`<br><span class="muted">${notes.join(" • ")}</span>`:""}`;
log(`${a.name} used <b>${move.n}</b> → ${damage} damage. ${d.name}: ${d.hp} HP.`);if(d.hp<=0){S.over=true;$("#result").innerHTML+=`<br><br><span class="big">🏆 ${a.name} WINS!</span>`;return render()}}
else{$("#result").innerHTML=`<h3>BLOCKED</h3>${a.name}'s ${move.n} failed.<br>Attack <b>${atkTotal}</b> vs Defence <b>${defTotal}</b><br><span class="remain">${d.name}: ${d.hp} HP LEFT</span>`;log(`${a.name} used ${move.n} → blocked.`);
if(d.name==="Kentrosaurus" && defTotal-atkTotal>=4){a.hp=Math.max(0,a.hp-6);log(`${a.name} takes <b>6 spike counter damage</b>.`)}
if(d.name==="Indominus Rex")d.nextAtk+=3;
if(d.name==="Ceratosaurus female" && dr===6)d.nextAtk+=3;
}
next()}
function next(){let ma=S?matchups[key(S.f[0].name,S.f[1].name)]:null;if(ma)$("#matchEvent").innerHTML=`<div class="event"><b>${ma.title}</b> — ${ma.text}</div>`;else $("#matchEvent").innerHTML="";S.turn=1-S.turn;if(S.turn===0)S.round++;S.f.forEach(f=>{if(f.defMod<0)f.defMod=0;if(f.spdMod<0)f.spdMod=0});render()}
$("#roll").onclick=()=>{if(!S||S.over)return;$("#roll").disabled=true;let t=setInterval(()=>{$("#ad").textContent=d6();$("#dd").textContent=d6()},70);setTimeout(()=>{clearInterval(t);let a=d6(),d=d6();$("#ad").textContent=a;$("#dd").textContent=d;resolve(a,d);if(S&&!S.over)$("#roll").disabled=false},650)};
$("#start").onclick=start;$("#rematch").onclick=()=>S&&start();render();
</script></body></html>
