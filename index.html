<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jurassic Toy Battle V3</title><style>
:root{--bg:#06110d;--panel:#0d2119;--line:#2b5b46;--text:#eef7f1;--muted:#9db5a9;--green:#68db82;--gold:#f0c95f;--red:#ff766e;--blue:#76bdff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top,#17492f,#07140f 40%,#020605);color:var(--text);min-height:100vh}.app{max-width:1050px;margin:auto;padding:16px}
h1{margin:5px 0;font-size:clamp(30px,7vw,52px)}.muted{color:var(--muted)}.panel,.card,.result{background:#0d2119eF;border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:14px}
.setup{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}select,button{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#081813;color:var(--text);font-size:16px}button{font-weight:800}.primary{background:linear-gradient(135deg,#2d9652,#64d77d);color:#041008;border:0}.vs{font-weight:900;color:var(--gold);padding-bottom:11px}

.attacks{display:grid;gap:7px;margin-top:10px}.atkBtn{text-align:left;padding:10px;background:#0a1b14}.atkBtn.selected{outline:2px solid var(--gold);background:#2a230c}.atkBtn small{display:block;color:var(--muted);font-weight:400}.atkBtn b{color:var(--gold)}
.abilityBox{margin-top:10px;display:grid;gap:6px}.ability{background:#07160f;border:1px solid #234a37;border-radius:9px;padding:8px;font-size:12px}.ability strong{color:var(--green)}.ability em{color:var(--gold);font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.doubleEvent{animation:dblPop .55s ease;background:linear-gradient(135deg,#39270a,#6b4c11);border:2px solid var(--gold);box-shadow:0 0 30px #f0c95f55}@keyframes dblPop{0%{transform:scale(.82);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.flashCrit{animation:critFlash .45s ease}@keyframes critFlash{0%,100%{filter:none}45%{filter:brightness(1.8);transform:scale(1.015)}}.center{text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px}.dice{display:flex;gap:10px;justify-content:center}.die{width:82px;height:82px;background:#f6f2e8;color:#111;border-radius:17px;display:grid;place-items:center;font-size:44px;font-weight:950;border:5px solid #ddd4c4}.die.a{border-color:#e3b941}.die.d{border-color:#67aee8}.roll{background:linear-gradient(135deg,#d4a62f,#f4d771);color:#191103;border:0}.event{border:1px solid #775f23;background:#2a230d;padding:9px;border-radius:10px;color:#ffe596}.result h3{margin:0 0 7px;color:var(--gold)}.big{font-size:24px;font-weight:950}.damage{color:var(--red)}.remain{color:var(--green)}.logentry{padding:8px;background:#07160f;border-radius:8px;margin-top:5px;font-size:13px}
@media(max-width:800px){.setup,.arena{grid-template-columns:1fr}.vs{text-align:center;padding:0}.center{order:-1}.die{width:90px;height:90px}}
.screen{display:none}.screen.active{display:block}

</style></head><body>
<main class="app">

<section id="selectionScreen" class="screen active">
  <div class="selectionHero">
    <h1>JURASSIC TOY BATTLE</h1>
    <h2>CHOOSE YOUR FIGHTERS</h2>
    <div class="muted">Pick two dinosaurs, then enter the battle arena.</div>
  </div>
  <section class="panel selectionGrid">
    <div><label>Fighter 1</label><select id="p1"></select></div>
    <div class="vs">VS</div>
    <div><label>Fighter 2</label><select id="p2"></select></div>
    <button class="primary" id="start" style="grid-column:1/-1">ENTER BATTLE ARENA</button>
  </section>
  <div class="topActions">
    <button id="historyFromSelect" class="historyBtn">📜 Battle History</button>
    <button id="soundToggleSelect" class="soundBtn">🔊 Sound On</button>
  </div>
</section>

<section id="battleScreen" class="screen">
  <div class="battleTop">
    <button id="changeFighters" class="backBtn">← Change Fighters</button>
    <div class="battleTitle">JURASSIC TOY BATTLE</div>
    <div style="display:flex;gap:6px">
      <button id="historyFromBattle" class="historyBtn">📜</button>
      <button id="soundToggleBattle" class="soundBtn">🔊</button>
    </div>
  </div>

  <div id="matchEvent"></div>

  <section class="arena">
    <div id="c1" class="card"></div>
    <div class="center">
      <div id="turn" class="big">Battle</div>
      <div class="dice">
        <div class="die a" id="ad">⚅</div>
        <div class="die d" id="dd">⚄</div>
      </div>
      <button class="roll" id="roll">ROLL ATTACK</button>
      <div class="muted">Choose a strike first</div>
    </div>
    <div id="c2" class="card"></div>
  </section>

  <section class="result" id="result">
    <h3>Battle Result</h3>
    Start a battle.
  </section>

  <section class="panel battleLog">
    <button id="rematch">Rematch</button>
    <h3>Battle Log</h3>
    <div id="history"></div>
  </section>
</section>


<section id="historyScreen" class="screen">
  <div class="historyHeader">
    <button id="historyBack" class="backBtn">← Back</button>
    <h2 style="margin:0">BATTLE HISTORY</h2>
    <button id="clearHistory" class="historyBtn">Clear</button>
  </div>
  <section class="panel">
    <div id="historyList" class="historyList"></div>
  </section>
</section>

</main>

if(a.name==="Ceratosaurus male" && d.name==="Ceratosaurus female")bonus+=3;
if(a.name==="Ceratosaurus female" && d.atk>=30)a.guard+=2;
if(a.name==="Tyrannotitan" && d.hp<30 && move.kind==="bite")extra+=5;
if(a.name==="Gorgosaurus" && d.hp<35)bonus+=3;
if(a.name==="Allosaurus" && move.kind==="bite")extra+=2;
if(move.effect==="mutation"){let r=d6();if(r<=2){a.hp=Math.min(100,a.hp+8);notes.push("Mutation healed 8 HP")}else extra+=8}
if(m){if(m.bonus)extra+=m.bonus;if(m.crit&&ar===6)extra+=m.crit;if(m.atkBoth)bonus+=m.atkBoth;if(m.trexAtk&&a.name==="T. rex")bonus+=m.trexAtk;if(m.indoDef&&d.name==="Indominus Rex")d.guard+=m.indoDef;if(m.stegoDefVsBite&&d.name==="Stegosaurus"&&move.kind==="bite")d.guard+=m.stegoDefVsBite;if(m.claw&&a.name==="Therizinosaurus"&&move.kind==="claw")extra+=m.claw;if(m.bite&&a.name==="T. rex"&&move.kind==="bite")extra+=m.bite}
let atkTotal=a.atk+move.power+move.acc+ar+bonus,defTotal=Math.max(0,d.def+d.defMod+d.guard-pierce)+dr+(dr===6?5:0);d.guard=0;
let margin=atkTotal-defTotal,damage=0,crit=ar===6;
if(margin>0){damage=Math.max(6,Math.round(margin*1.25)+extra+(crit?8:0));
if(a.name==="Brachiosaurus" && move.n==="Stomp")damage=Math.max(14,damage);if(move.effect==="min10")damage=Math.max(10,damage);if(m&&m.firstHit&&S.firstHit){damage+=m.firstHit;S.firstHit=false}
if(d.name==="Brachiosaurus")damage=Math.max(0,damage-4);
d.lastDamageTaken=damage;
S.biggestHit=Math.max(S.biggestHit||0,damage);
d.hp=Math.max(0,d.hp-damage);
if(a.name==="Brachiosaurus" && move.n==="Stomp"){
  playRealSfx("sfxBrachioStomp",1.0);
}else{
  playRealSfx("sfxNormalHit", damage>=20 ? 1.0 : 0.82);
}
if(d.name==="Pteranodon" && damage>=15)d.guard+=4;
if(d.name==="Quetzalcoatlus" && damage>=15)d.guard+=4;
if(d.name==="Scorpios Rex" && damage>=20)d.nextAtk+=5;
if(d.name==="Giganotosaurus" && damage>=15)d.nextAtk+=3;
if(move.effect==="poison")d.poison=Math.max(d.poison||0,5);if(move.effect==="slow2")d.spdMod=-2;if(move.effect==="defdown3")d.defMod=-3;if(move.effect==="defdown2")d.defMod=-2;if(move.effect==="guard6")a.guard=6;if(move.effect==="guard8")a.guard=8;if(move.effect==="guard5")a.guard=5;if(move.effect==="guard4")a.guard=4;
$("#result").innerHTML=`<h3>${crit?"CRITICAL HIT!":"HIT!"}</h3><span class="big">${a.name} used ${move.n}</span><br>Attack ${ar} → <b>${atkTotal}</b> vs Defence ${dr} → <b>${defTotal}</b><br><span class="damage big">${damage} DAMAGE</span><br><span class="remain big">${d.name}: ${d.hp} HP LEFT</span>${notes.length?`<br><span class="muted">${notes.join(" • ")}</span>`:""}`;
log(`${a.name} used <b>${move.n}</b> → ${damage} damage. ${d.name}: ${d.hp} HP.`);if(d.hp<=0){S.over=true;sfx("win");saveBattleRecord(a,d);$("#result").innerHTML+=`<br><br><span class="big">🏆 ${a.name} WINS!</span>`;return render()}}
else{$("#result").innerHTML=`<h3>BLOCKED</h3>${a.name}'s ${move.n} failed.<br>Attack <b>${atkTotal}</b> vs Defence <b>${defTotal}</b><br><span class="remain">${d.name}: ${d.hp} HP LEFT</span>`;sfx("block");log(`${a.name} used ${move.n} → blocked.`);
if(d.name==="Kentrosaurus" && defTotal-atkTotal>=4){a.hp=Math.max(0,a.hp-6);log(`${a.name} takes <b>6 spike counter damage</b>.`)}
if(d.name==="Indominus Rex")d.nextAtk+=3;
if(d.name==="Ceratosaurus female" && dr===6)d.nextAtk+=3;
}
next()}
function next(){let ma=S?matchups[key(S.f[0].name,S.f[1].name)]:null;if(ma)$("#matchEvent").innerHTML=`<div class="event"><b>${ma.title}</b> — ${ma.text}</div>`;else $("#matchEvent").innerHTML="";S.turn=1-S.turn;if(S.turn===0)S.round++;S.f.forEach(f=>{if(f.defMod<0)f.defMod=0;if(f.spdMod<0)f.spdMod=0});render()}
$("#roll").onclick=()=>{if(!S||S.over)return;ensureAudio();sfx("roll");$("#roll").disabled=true;let t=setInterval(()=>{$("#ad").textContent=d6();$("#dd").textContent=d6()},70);setTimeout(()=>{clearInterval(t);let a=d6(),d=d6();$("#ad").textContent=a;$("#dd").textContent=d;resolve(a,d);if(S&&!S.over)$("#roll").disabled=false},650)};
$("#start").onclick=()=>{ensureAudio();start()};
$("#rematch").onclick=()=>S&&start();
$("#changeFighters").onclick=()=>showScreen("#selectionScreen");
$("#historyFromSelect").onclick=()=>openHistory("#selectionScreen");
$("#historyFromBattle").onclick=()=>openHistory("#battleScreen");
$("#historyBack").onclick=()=>showScreen(window.historyReturnScreen||"#selectionScreen");
$("#clearHistory").onclick=()=>{if(confirm("Clear all battle history?")){localStorage.removeItem(HIST_KEY);renderBattleHistory()}};
$("#soundToggleSelect").onclick=toggleSound;
$("#soundToggleBattle").onclick=toggleSound;
updateSoundButtons();render();
</script>
