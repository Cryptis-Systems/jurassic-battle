<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jurassic Toy Battle</title>
<style>
:root{--bg:#06110d;--panel:#0d2119;--panel2:#133126;--line:#2b5b46;--text:#eef7f1;--muted:#9db5a9;--green:#60d47b;--gold:#f1c85b;--red:#ff665d;--blue:#69b8ff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at top,#15462e 0,#07140f 42%,#020605 100%);min-height:100vh}
.app{max-width:1100px;margin:auto;padding:18px}h1{font-size:clamp(30px,7vw,54px);margin:4px 0;letter-spacing:.05em}.sub{color:var(--muted);margin-bottom:18px}
.panel{background:rgba(13,33,25,.94);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 16px 50px #0007}
.setup{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
select,button{width:100%;border:1px solid var(--line);background:#081813;color:var(--text);border-radius:12px;padding:13px;font-size:16px}button{font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#268b4a,#62d17b);color:#041009;border:0}.vs{color:var(--gold);font-size:23px;font-weight:900;padding-bottom:11px}
.arena{display:grid;grid-template-columns:1fr 230px 1fr;gap:14px;margin-top:16px}.card{background:linear-gradient(180deg,#153429,#0b1d16);border:1px solid var(--line);border-radius:19px;padding:16px}.card.active{outline:2px solid var(--green);box-shadow:0 0 28px #61d47b22}.card h2{margin:0;font-size:25px}.turn{font-size:11px;letter-spacing:.12em;color:var(--green);font-weight:900;height:18px}
.hpbar{height:17px;background:#321715;border-radius:20px;overflow:hidden;margin:13px 0 5px}.hpfill{height:100%;background:linear-gradient(90deg,#e44740,#ff9d61);transition:.35s}.hp{font-weight:900;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.stat{text-align:center;background:#07140f;border:1px solid #244b39;border-radius:10px;padding:9px;font-size:12px}.stat b{display:block;color:var(--gold);font-size:21px}
.special{background:#07150f;border-left:4px solid var(--green);border-radius:8px;padding:10px;font-size:13px}.special b{color:var(--gold)}
.specialBtn{margin-top:10px;background:#4a3710;border-color:#7d6424;color:#ffe18c}.specialBtn.armed{background:#826016}.specialBtn:disabled{opacity:.45}
.center{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}.diceRow{display:flex;gap:12px}.dieBox{text-align:center}.dieLabel{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}.die{width:88px;height:88px;border-radius:19px;background:#f6f2e7;color:#111;display:grid;place-items:center;font-size:48px;font-weight:950;box-shadow:0 12px 28px #0007;border:5px solid #ddd5c5;user-select:none}.die.attack{border-color:#e7bd51}.die.defence{border-color:#66a9df}.rolling{animation:roll .75s ease}@keyframes roll{0%{transform:rotate(0) scale(1)}30%{transform:rotate(140deg) scale(.82)}60%{transform:rotate(330deg) scale(1.13)}100%{transform:rotate(720deg) scale(1)}}
.rollBtn{background:linear-gradient(135deg,#d6a62e,#f3d46d);color:#171004;border:0}.rollBtn:disabled{opacity:.45}
.result{margin-top:16px;background:linear-gradient(180deg,#13291f,#0a1812);border:2px solid #3a7056;border-radius:18px;padding:17px;min-height:150px}.result h3{margin:0 0 8px;color:var(--gold);font-size:22px}.big{font-size:25px;font-weight:950}.damage{color:#ff8b82}.remain{color:#79e38f}.crit{color:#ffd665}.blocked{color:#74bcff}.small{font-size:13px;color:var(--muted)}
.log{margin-top:16px}.entry{background:#091813;border:1px solid #234634;border-radius:9px;padding:9px;margin-top:6px;font-size:13px}.winner{font-size:29px;font-weight:950;color:var(--gold);margin-bottom:10px}.controls{display:flex;gap:8px;margin-top:12px}
@media(max-width:800px){.setup{grid-template-columns:1fr}.vs{text-align:center;padding:0}.arena{grid-template-columns:1fr}.center{order:-1}.diceRow{gap:16px}.die{width:94px;height:94px}.result{min-height:auto}}
</style>
</head>
<body><main class="app">
<h1>JURASSIC TOY BATTLE</h1><div class="sub">100 HP each • roll Attack + Defence dice every turn • critical hits and dinosaur specials</div>
<section class="panel setup">
<div><label>Fighter 1</label><select id="p1"></select></div><div class="vs">VS</div><div><label>Fighter 2</label><select id="p2"></select></div>
<button id="start" class="primary" style="grid-column:1/-1">START BATTLE</button>
</section>
<section class="arena">
<div class="card" id="c1"></div>
<div class="center">
<div id="turnName" class="big">Choose fighters</div>
<div class="diceRow">
 <div class="dieBox"><div class="dieLabel">ATTACK</div><div class="die attack" id="ad">⚅</div></div>
 <div class="dieBox"><div class="dieLabel">DEFENCE</div><div class="die defence" id="dd">⚄</div></div>
</div>
<button class="rollBtn" id="roll">ROLL BOTH DICE</button>
<div class="small">Attack 6 = CRITICAL • Attack 1 = MISS • Defence 6 = CRITICAL DEFENCE</div>
</div>
<div class="card" id="c2"></div>
</section>
<section class="result" id="result"><h3>Battle Result</h3><div>Choose two dinosaurs and start the battle.</div></section>
<section class="panel log"><div id="winner"></div><div class="controls"><button id="rematch">Rematch</button><button id="reset">Reset</button></div><h3>Battle Log</h3><div id="history"></div></section>
</main>
<script>
const dinos = [{"name": "Scorpios Rex", "hp": 100, "atk": 24, "def": 15, "spd": 9, "special": "Venom Quills", "type": "trigger6", "effect": "On an attack roll of 6, +8 damage and 4 poison damage next turn."}, {"name": "Indominus Rex", "hp": 100, "atk": 31, "def": 23, "spd": 8, "special": "Camouflage", "type": "manual_def", "effect": "Once per battle: +10 DEF for the current defence roll."}, {"name": "Pteranodon", "hp": 100, "atk": 11, "def": 7, "spd": 10, "special": "Dive Attack", "type": "first", "effect": "First attack of the battle gets +8 ATK."}, {"name": "Brachiosaurus", "hp": 100, "atk": 17, "def": 26, "spd": 2, "special": "Massive Stomp", "type": "manual_atk", "effect": "Once per battle: +12 ATK for one attack."}, {"name": "Suchomimus", "hp": 100, "atk": 20, "def": 16, "spd": 7, "special": "Hook Claws", "type": "trigger56", "effect": "Attack roll of 5 or 6: +6 damage on a hit."}, {"name": "T. rex", "hp": 100, "atk": 30, "def": 22, "spd": 5, "special": "Crushing Bite", "type": "manual_atk", "effect": "Once per battle: +12 ATK for one attack."}, {"name": "Kentrosaurus", "hp": 100, "atk": 20, "def": 27, "spd": 4, "special": "Spiked Tail", "type": "counter", "effect": "If defence wins by 4+, attacker takes 6 damage."}, {"name": "Giganotosaurus", "hp": 100, "atk": 28, "def": 20, "spd": 5, "special": "Powerful Bite", "type": "min6", "effect": "Any successful hit deals at least 6 damage."}, {"name": "Spinosaurus \u2013 Tail Strike", "hp": 100, "atk": 25, "def": 18, "spd": 6, "special": "Tail Strike", "type": "manual_atk", "effect": "Once per battle: +9 ATK. On hit, opponent gets -2 SPD next turn."}, {"name": "Spinosaurus \u2013 Extreme Damage", "hp": 100, "atk": 27, "def": 18, "spd": 6, "special": "Extreme Damage", "type": "manual_damage", "effect": "Once per battle: +12 damage after a successful hit."}, {"name": "Becklespinax", "hp": 100, "atk": 23, "def": 17, "spd": 7, "special": "Rush Attack", "type": "first", "effect": "First attack gets +6 ATK."}, {"name": "Carnotaurus", "hp": 100, "atk": 21, "def": 13, "spd": 9, "special": "Charge", "type": "first", "effect": "First attack gets +9 ATK."}, {"name": "Distortus Rex", "hp": 100, "atk": 32, "def": 25, "spd": 7, "special": "Mutation", "type": "mutation", "effect": "Once per battle: roll for +9 DEF, +9 ATK, or heal 14 HP."}, {"name": "Stegosaurus", "hp": 100, "atk": 27, "def": 29, "spd": 3, "special": "Thagomizer", "type": "manual_atk", "effect": "Once per battle: +12 ATK for one attack."}, {"name": "Therizinosaurus", "hp": 100, "atk": 27, "def": 15, "spd": 6, "special": "Claw Slash", "type": "margin6", "effect": "If attack wins by 6+, deal +9 damage."}, {"name": "Minotaurus", "hp": 100, "atk": 21, "def": 23, "spd": 5, "special": "Armoured Charge", "type": "manual_defatk", "effect": "Once per battle: use DEF as ATK and gain +5 damage on a hit."}, {"name": "Eotriceratops", "hp": 100, "atk": 24, "def": 27, "spd": 4, "special": "Horn Charge", "type": "first", "effect": "First attack gets +9 ATK."}, {"name": "Ceratosaurus male", "hp": 100, "atk": 21, "def": 17, "spd": 7, "special": "Aggressive Bite", "type": "lowhp", "effect": "Below 50 HP: +4 ATK."}, {"name": "Ceratosaurus female", "hp": 100, "atk": 20, "def": 16, "spd": 8, "special": "Quick Attack", "type": "speed", "effect": "If faster than opponent: +5 ATK."}, {"name": "Tyrannotitan", "hp": 100, "atk": 27, "def": 20, "spd": 6, "special": "Bone Crusher", "type": "min6", "effect": "Any successful hit deals at least 6 damage."}, {"name": "Baryonyx", "hp": 100, "atk": 20, "def": 15, "spd": 7, "special": "Claw Rake", "type": "reroll1", "effect": "Attack roll of 1 is automatically rerolled once."}, {"name": "Gorgosaurus", "hp": 100, "atk": 23, "def": 17, "spd": 8, "special": "Pursuit Predator", "type": "speed", "effect": "If faster than opponent: +6 ATK."}, {"name": "Quetzalcoatlus", "hp": 100, "atk": 16, "def": 9, "spd": 9, "special": "Aerial Strike", "type": "manual_atk", "effect": "Once per battle: +9 ATK for one attack."}, {"name": "Allosaurus", "hp": 100, "atk": 23, "def": 17, "spd": 7, "special": "Serrated Bite", "type": "trigger6", "effect": "Attack roll of 6: +9 extra damage."}];
const $=s=>document.querySelector(s), p1=$("#p1"),p2=$("#p2"),c1=$("#c1"),c2=$("#c2"),ad=$("#ad"),dd=$("#dd"),result=$("#result"),history=$("#history"),winner=$("#winner"),rollBtn=$("#roll");
dinos.forEach((d,i)=>{p1.add(new Option(d.name,i));p2.add(new Option(d.name,i))});p2.selectedIndex=5;
let S=null;
const d6=()=>Math.floor(Math.random()*6)+1;
function F(d){return {...d,maxHp:100,currentHp:100,firstAttack:true,specialUsed:false,specialArmed:false,poison:0}}
function card(el,f,i){
 if(!f){el.innerHTML="<div class='small'>No fighter selected</div>";return}
 let pct=Math.max(0,f.currentHp), active=S&&!S.over&&S.turn===i;
 el.className="card"+(active?" active":"");
 let canManual=["manual_atk","manual_damage","manual_defatk","mutation"].includes(f.type);
 el.innerHTML=`<div class="turn">${active?"CURRENT TURN":""}</div><h2>${f.name}</h2>
 <div class="hpbar"><div class="hpfill" style="width:${pct}%"></div></div><div class="hp">${f.currentHp} / 100 HP</div>
 <div class="stats"><div class="stat">ATK<b>${f.atk}</b></div><div class="stat">DEF<b>${f.def}</b></div><div class="stat">SPD<b>${f.spd}</b></div></div>
 <div class="special"><b>${f.special}</b><br>${f.effect}</div>
 ${canManual?`<button class="specialBtn ${f.specialArmed?"armed":""}" data-i="${i}" ${f.specialUsed||!active?"disabled":""}>${f.specialArmed?"SPECIAL ARMED":"USE SPECIAL"}</button>`:""}`;
}
function render(){
 if(!S){card(c1,null,0);card(c2,null,1);rollBtn.disabled=true;return}
 card(c1,S.f[0],0);card(c2,S.f[1],1);rollBtn.disabled=S.over;
 $("#turnName").textContent=S.over?"BATTLE OVER":S.f[S.turn].name+"'s turn";
 document.querySelectorAll(".specialBtn").forEach(b=>b.onclick=()=>{let f=S.f[+b.dataset.i];f.specialArmed=!f.specialArmed;render()})
}
function log(x){let e=document.createElement("div");e.className="entry";e.innerHTML=x;history.prepend(e)}
function show(title,body,cls=""){result.innerHTML=`<h3>${title}</h3><div class="${cls}">${body}</div>`}
function start(){
 if(p1.value===p2.value){alert("Choose two different dinosaurs.");return}
 let a=F(dinos[p1.value]),b=F(dinos[p2.value]);let first=a.spd===b.spd?(d6()>=4?0:1):(a.spd>b.spd?0:1);
 S={f:[a,b],turn:first,round:1,over:false};history.innerHTML="";winner.innerHTML="";
 show("Battle begins",`${S.f[first].name} is faster and attacks first.`);log(`<b>Battle begins.</b> ${S.f[first].name} attacks first.`);render()
}
function finish(i){S.over=true;winner.innerHTML=`<div class="winner">🏆 ${S.f[i].name} WINS!</div>`;show("KNOCKOUT!",`<span class="big">${S.f[i].name} wins!</span>`);log(`<b>${S.f[i].name} wins the battle.</b>`);render()}
function resolve(ar,dr){
 let ai=S.turn,di=1-ai,a=S.f[ai],d=S.f[di],notes=[],bonus=0,extra=0;
 if(a.poison){a.currentHp=Math.max(0,a.currentHp-a.poison);log(`${a.name} takes <b>${a.poison} poison damage</b>.`);a.poison=0;if(a.currentHp<=0)return finish(di)}
 if(ar===1 && a.type==="reroll1"){let nr=d6();notes.push(`Claw Rake reroll: 1 → ${nr}`);ar=nr;ad.textContent=nr}
 if(ar===1){show("MISS!",`${a.name} rolled 1 and misses.<br><span class="remain">${d.name}: ${d.currentHp} HP remaining</span>`,"blocked");log(`Round ${S.round}: ${a.name} rolled 1 — <b>MISS</b>.`);a.firstAttack=false;return next()}
 if(a.firstAttack){
   if(a.name==="Pteranodon"){bonus+=8;notes.push("Dive Attack +8 ATK")}
   if(a.name==="Becklespinax"){bonus+=6;notes.push("Rush Attack +6 ATK")}
   if(a.name==="Carnotaurus"||a.name==="Eotriceratops"){bonus+=9;notes.push(`${a.special} +9 ATK`)}
 }
 if(a.type==="speed" && a.spd>d.spd){let x=a.name==="Gorgosaurus"?6:5;bonus+=x;notes.push(`${a.special} +${x} ATK`)}
 if(a.type==="lowhp" && a.currentHp<50){bonus+=4;notes.push("Aggressive Bite +4 ATK")}
 if(a.specialArmed && !a.specialUsed){
   if(a.type==="manual_atk"){let x=a.name.includes("Spinosaurus")?9:12;if(a.name==="Quetzalcoatlus")x=9;bonus+=x;notes.push(`${a.special} +${x} ATK`)}
   if(a.type==="manual_defatk"){bonus+=(a.def-a.atk);extra+=5;notes.push("Armoured Charge")}
   if(a.type==="mutation"){let m=d6();if(m<=2){a.currentHp=Math.min(100,a.currentHp+14);notes.push("Mutation heals 14 HP")}else if(m<=4){bonus+=9;notes.push("Mutation +9 ATK")}else{extra+=9;notes.push("Mutation +9 damage")}}
   a.specialUsed=true;a.specialArmed=false;
 }
 if(a.type==="trigger56" && ar>=5){extra+=6;notes.push("Hook Claws +6 damage")}
 if(a.name==="Scorpios Rex" && ar===6){extra+=8;d.poison=4;notes.push("Venom Quills +8 and poison")}
 if(a.name==="Allosaurus" && ar===6){extra+=9;notes.push("Serrated Bite +9")}
 let crit=ar===6;if(crit){extra+=8;notes.push("CRITICAL HIT +8")}
 let critDef=dr===6;
 let atkTotal=a.atk+bonus+ar, defTotal=d.def+dr+(critDef?6:0);
 let margin=atkTotal-defTotal,damage=0;
 if(margin>0){
   damage=margin+extra;
   if(a.type==="min6")damage=Math.max(6,damage);
   if(a.type==="margin6"&&margin>=6){damage+=9;notes.push("Claw Slash +9")}
   if(a.specialUsed && a.type==="manual_damage"){damage+=12;notes.push("Extreme Damage +12")}
   d.currentHp=Math.max(0,d.currentHp-damage);
   let critText=crit?` <span class="crit">CRITICAL HIT!</span>`:"";
   show(`${a.name} HITS!`,`${critText}<br>Attack die: <b>${ar}</b> → total <b>${atkTotal}</b><br>Defence die: <b>${dr}</b> → total <b>${defTotal}</b>${critDef?" (Critical Defence)":""}<br><span class="damage big">${damage} DAMAGE</span><br><span class="remain big">${d.name}: ${d.currentHp} HP LEFT</span>${notes.length?`<br><span class="small">${notes.join(" • ")}</span>`:""}`);
   log(`Round ${S.round}: <b>${a.name}</b> ${atkTotal} vs ${d.name} ${defTotal} → <b>${damage} damage</b>. ${d.currentHp} HP left.`);
 } else {
   show("BLOCKED!",`${d.name} stops the attack.<br>Attack die: <b>${ar}</b> → total <b>${atkTotal}</b><br>Defence die: <b>${dr}</b> → total <b>${defTotal}</b>${critDef?" <span class='crit'>CRITICAL DEFENCE!</span>":""}<br><span class="remain big">${d.name}: ${d.currentHp} HP LEFT</span>`,"blocked");
   log(`Round ${S.round}: ${a.name} ${atkTotal} vs ${d.name} ${defTotal} → <b>blocked</b>.`);
   if(d.type==="counter" && defTotal-atkTotal>=4){a.currentHp=Math.max(0,a.currentHp-6);log(`${a.name} takes <b>6 spike damage</b>.`)}
 }
 a.firstAttack=false;
 if(d.currentHp<=0)return finish(ai);if(a.currentHp<=0)return finish(di);next()
}
function next(){S.turn=1-S.turn;if(S.turn===0)S.round++;render()}
rollBtn.onclick=()=>{
 if(!S||S.over)return;rollBtn.disabled=true;
 ad.classList.remove("rolling");dd.classList.remove("rolling");void ad.offsetWidth;ad.classList.add("rolling");dd.classList.add("rolling");
 let t=setInterval(()=>{ad.textContent=d6();dd.textContent=d6()},75);
 setTimeout(()=>{clearInterval(t);let a=d6(),d=d6();ad.textContent=a;dd.textContent=d;resolve(a,d);if(S&&!S.over)rollBtn.disabled=false},760)
};
$("#start").onclick=start;$("#rematch").onclick=()=>S&&start();$("#reset").onclick=()=>{S=null;history.innerHTML="";winner.innerHTML="";show("Battle Result","Choose two dinosaurs and start the battle.");$("#turnName").textContent="Choose fighters";render()};
render();
</script></body></html>
